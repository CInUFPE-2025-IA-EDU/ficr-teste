name: Export Metrics
on:
  schedule:
    - cron: '0 3 * * *'   # diário 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run collector
        env:
          ORG: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p metrics
          python tools/collect_metrics.py > metrics/metrics.csv
      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/metrics.csv
          git commit -m "chore(metrics): update metrics.csv [skip ci]" || echo "no changes"
          git push

